<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MenuApp · 02-auth · s02-otp</title>
<meta name="viewport" content="width=220, initial-scale=1">
<style>
:root {
  --canvas: #FAFAF8; --surface: #FFFFFF; --ink: #1C1917; --ink-2: #57534E;
  --ink-3: #A8A29E; --ink-4: #D6D3D1; --line: #E7E5E4; --field: #F5F5F4;
  --accent: #F97316; --ok: #16A34A; --bezel: #2C2820; --bezel-2: #3D3530;
  --doc-bg: #FAFAF8; --anno-bg: #F0EFEC; --serif: Georgia,'Times New Roman',serif;
  --sans: -apple-system,'SF Pro Text','Helvetica Neue',system-ui,sans-serif;
  --mono: ui-monospace,'SF Mono','Roboto Mono',monospace;
}
@media (prefers-color-scheme: dark) { :root { --doc-bg:#1C1917;--anno-bg:#262220;--ink:#FAF9F7;--ink-2:#C4B8B0;--ink-3:#8C837D;--ink-4:#4A4540;--line:#3A3530; } }
:root[data-theme="dark"] { --doc-bg:#1C1917;--anno-bg:#262220;--ink:#FAF9F7;--ink-2:#C4B8B0;--ink-3:#8C837D;--ink-4:#4A4540;--line:#3A3530; }
:root[data-theme="light"] { --doc-bg:#FAFAF8;--anno-bg:#F0EFEC;--ink:#1C1917;--ink-2:#57534E;--ink-3:#A8A29E;--ink-4:#D6D3D1;--line:#E7E5E4; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--doc-bg); color: var(--ink); font-family: var(--sans); font-size: 14px; }
body { min-height: 100vh; }

.doc-header { display:flex;align-items:baseline;justify-content:space-between;padding:20px 32px 16px;border-bottom:1px solid var(--line); }
.doc-eyebrow { font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase; }
.doc-title { font-family:var(--serif);font-size:22px;font-weight:normal;color:var(--ink);margin-top:2px; }
.doc-meta { font-family:var(--mono);font-size:10px;color:var(--ink-3);text-align:right;line-height:1.6; }

.storyboard-scroll { overflow-x:auto;padding:36px 32px 0; }
.storyboard { display:flex;align-items:flex-start;gap:0;min-width:max-content; }
.frame-col { display:flex;flex-direction:column;align-items:center;width:240px; }
.frame-label { font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px; }
.frame-name { font-family:var(--serif);font-size:13px;color:var(--ink);margin-bottom:12px;text-align:center; }

.connector { display:flex;flex-direction:column;align-items:center;justify-content:center;width:60px;padding-top:68px;flex-shrink:0; }
.conn-line { width:36px;height:1px;border-top:1.5px dashed #D6D3D1; }
.conn-arrow { width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:5px solid #D6D3D1;margin-left:-1px; }
.conn-label { margin-top:6px;font-family:var(--mono);font-size:8px;color:var(--ink-3);text-align:center;max-width:52px;line-height:1.4; }
.conn-branch { font-family:var(--mono);font-size:8px;color:#F97316;text-align:center;max-width:52px;line-height:1.4;margin-top:2px; }

.phone { width:220px;height:472px;background:var(--bezel);border-radius:38px;padding:8px;box-shadow:0 0 0 1px var(--bezel-2),0 20px 60px rgba(0,0,0,.22),0 4px 12px rgba(0,0,0,.12);position:relative;flex-shrink:0; }
.phone-screen { width:100%;height:100%;background:#FAFAF8;border-radius:31px;overflow:hidden;position:relative;display:flex;flex-direction:column; }
.dynamic-island { position:absolute;top:10px;left:50%;transform:translateX(-50%);width:78px;height:22px;background:var(--bezel);border-radius:20px;z-index:10; }
.status-bar { height:44px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 16px 6px;flex-shrink:0;position:relative;z-index:1; }
.status-time { font-size:11px;font-weight:600;color:#1C1917;letter-spacing:-.3px; }
.status-icons { display:flex;align-items:center;gap:4px; }

/* dark screen variant */
.phone-screen.dark { background:#1C1917; }
.phone-screen.dark .status-time { color:#FAFAF8; }

/* shared UI atoms */
.btn-primary { background:#F97316;color:#fff;border:none;border-radius:12px;font-size:11px;font-weight:600;padding:11px 14px;width:100%;text-align:center; }
.btn-apple { background:#1C1917;color:#fff;border:none;border-radius:12px;font-size:11px;font-weight:600;padding:11px 14px;width:100%;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px; }
.btn-outline { background:transparent;color:#F97316;border:1.5px solid #F97316;border-radius:12px;font-size:10px;font-weight:600;padding:9px 14px;width:100%;text-align:center; }
.link-center { font-size:9.5px;color:#A8A29E;text-align:center; }
.link-accent { font-size:9.5px;color:#F97316;text-align:center; }
.divider-or { display:flex;align-items:center;gap:8px;margin:10px 0; }
.divider-or-line { flex:1;height:1px;background:#E7E5E4; }
.divider-or-text { font-size:9px;color:#A8A29E; }

.field { background:#F5F5F4;border:1.5px solid #E7E5E4;border-radius:10px;padding:9px 12px;font-size:11px;color:#1C1917;width:100%; }
.field-label { font-size:9px;font-weight:600;color:#57534E;margin-bottom:4px;letter-spacing:.02em; }
.field-hint { font-size:8.5px;color:#A8A29E;margin-top:3px; }
.field.focused { border-color:#F97316; }
.field.disabled { color:#A8A29E;background:#F0EFEC; }

/* OTP boxes */
.otp-row { display:flex;gap:6px;justify-content:center;margin:14px 0 8px; }
.otp-box { width:30px;height:38px;background:#F5F5F4;border:1.5px solid #E7E5E4;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#1C1917;flex-shrink:0; }
.otp-box.filled { border-color:#F97316;background:#FFF7ED; }
.otp-box.active { border-color:#F97316;background:#fff;box-shadow:0 0 0 3px rgba(249,115,22,.12); }

/* fake keyboard */
.keyboard { background:#D1D5DB;border-radius:8px 8px 0 0;padding:6px 4px 4px;flex-shrink:0; }
.kb-row { display:flex;gap:3px;margin-bottom:3px;justify-content:center; }
.kb-key { flex:1;max-width:28px;height:26px;background:#fff;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;color:#1C1917;box-shadow:0 1px 0 rgba(0,0,0,.2); }
.kb-key.wide { max-width:44px; }
.kb-key.space { max-width:96px; }
.kb-key.dark { background:#ADB5BD;color:#1C1917; }
.kb-key.num { font-size:11px;font-weight:600; }

/* success checkmark */
.success-circle { width:56px;height:56px;background:#DCFCE7;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px; }

/* wordmark / splash */
.splash-bg {
  flex:1;
  background: linear-gradient(160deg, #1C1917 0%, #292524 60%, #3D2008 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
}
.wordmark { font-family:Georgia,serif;font-size:22px;font-weight:normal;color:#FAFAF8;letter-spacing:-.3px; }
.wordmark-sub { font-size:9px;color:#A8A29E;letter-spacing:.12em;text-transform:uppercase; }
.logo-mark { width:44px;height:44px;background:#F97316;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:2px; }

/* annotations */
.annotations { display:flex;min-width:max-content;padding:0 32px;gap:60px;margin-top:0; }
.anno-col { width:240px;flex-shrink:0; }
.anno-block { background:var(--anno-bg);border-radius:10px;padding:12px 14px;margin-top:14px;border-left:2.5px solid var(--line); }
.anno-block.accent { border-left-color:#F97316; }
.anno-block.warn { border-left-color:#D97706; }
.anno-hed { font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px; }
.anno-body { font-size:10.5px;color:var(--ink-2);line-height:1.55; }
.anno-body strong { color:var(--ink);font-weight:600; }

.design-notes { margin:48px 32px 56px;display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:760px; }
.note-card { background:var(--anno-bg);border-radius:12px;padding:18px 20px; }
.note-hed { font-family:var(--serif);font-size:14px;color:var(--ink);margin-bottom:6px; }
.note-body { font-size:11px;color:var(--ink-2);line-height:1.6; }
.note-card.full { grid-column:span 2; }
.open-q { border-left:2.5px solid #D97706;padding-left:12px; }
.open-q .note-hed { color:#D97706; }

.section-divider { display:flex;align-items:center;gap:12px;padding:36px 32px 20px; }
.section-divider-label { font-family:var(--serif);font-size:16px;color:var(--ink);white-space:nowrap; }
.section-divider-line { flex:1;height:1px;background:var(--line); }

/* siwa branch note */
.branch-note { display:flex;align-items:center;gap:6px;padding:4px 0; }
.branch-dot { width:6px;height:6px;border-radius:50%;flex-shrink:0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 220px; height: 472px; overflow: hidden; background: #FAFAF8; }
</style>
</head>
<body>
<div class="phone">
      <div class="dynamic-island"></div>
      <div class="phone-screen">
        <div class="status-bar">
          <span class="status-time">9:41</span>
          <div class="status-icons">
            <svg width="13" height="9" viewBox="0 0 13 9" fill="none"><rect x="0" y="3" width="2.5" height="6" rx=".5" fill="#1C1917" opacity=".35"/><rect x="3.5" y="2" width="2.5" height="7" rx=".5" fill="#1C1917" opacity=".55"/><rect x="7" y=".5" width="2.5" height="8.5" rx=".5" fill="#1C1917" opacity=".8"/><rect x="10.5" y="0" width="2.5" height="9" rx=".5" fill="#1C1917"/></svg>
            <svg width="22" height="10" viewBox="0 0 22 10" fill="none"><rect x=".5" y=".5" width="18" height="9" rx="2.5" stroke="#1C1917" stroke-opacity=".35"/><rect x="1.5" y="1.5" width="12" height="7" rx="1.5" fill="#1C1917"/><path d="M19.5 3.5V6.5C20.3 6.2 21 5.5 21 5C21 4.5 20.3 3.8 19.5 3.5Z" fill="#1C1917" opacity=".4"/></svg>
          </div>
        </div>
        <div style="flex:1;padding:12px 18px 0;display:flex;flex-direction:column">
          <!-- back -->
          <div style="font-size:9px;color:#F97316;margin-bottom:14px">← Back</div>
          <div style="font-size:16px;font-weight:700;color:#1C1917;letter-spacing:-.3px;margin-bottom:4px">Check your email</div>
          <div style="font-size:9.5px;color:#A8A29E;line-height:1.5;margin-bottom:2px">We sent a 6-digit code to<br><strong style="color:#57534E">andrew@example.com</strong></div>
          <div class="otp-row">
            <div class="otp-box filled">3</div>
            <div class="otp-box filled">7</div>
            <div class="otp-box filled">4</div>
            <div class="otp-box active"></div>
            <div class="otp-box"></div>
            <div class="otp-box"></div>
          </div>
          <div class="link-center" style="margin-bottom:8px">Didn't get it? <span style="color:#F97316">Resend</span></div>
          <div class="link-center" style="font-size:8.5px;color:#D6D3D1">Expires in 9:42</div>
          <div style="flex:1"></div>
        </div>
        <!-- Numeric keyboard -->
        <div class="keyboard">
          <div class="kb-row">
            <div class="kb-key num">1</div><div class="kb-key num">2</div><div class="kb-key num">3</div>
          </div>
          <div class="kb-row">
            <div class="kb-key num">4</div><div class="kb-key num">5</div><div class="kb-key num">6</div>
          </div>

            <div class="kb-key num">7</div><div class="kb-key num">8</div><div class="kb-key num">9</div>
          </div>
          <div class="kb-row">
            <div class="kb-key dark" style="font-size:8px">*#</div>
            <div class="kb-key num">0</div>
            <div class="kb-key dark">
              <svg width="14" height="10" viewBox="0 0 20 14" fill="none" stroke="#1C1917" stroke-width="1.5" stroke-linecap="round"><path d="M7 2H18a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H7L1 7z"/><line x1="10" y1="5" x2="15" y2="9"/><line x1="15" y1="5" x2="10" y2="9"/></svg>
            </div>
          </div>
        </div>
      </div>
    </div>
</body>
</html>
